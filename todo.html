<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Todo App</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2022.12.1/pyscript.css" />

    <script defer src="https://pyscript.net/releases/2022.12.1/pyscript.js"></script>
    <link rel="stylesheet" href="./assets/css/todo.css" />
  </head>

  <body>
  <nav class="navbar">
      <div class="app-header">
        <a class="title" href="./todo.html">Daylist</a>
      </div>
    </nav>
    <section class="pyscript app-main">
  <py-config>
    [[fetch]]
    files = ["./utils.py"]
  </py-config>

  <py-script src="./todo.py">  </py-script>

    <main class="todo-card">
      <header class="intro">
        <p class="eyebrow">A little progress adds up</p>
        <h1>Your to-do list</h1>
        <p>Make space for what matters. Add a task and take it one step at a time.</p>
      </header>

      <div class="task-entry">
        <input id="new-task-content" type="text" placeholder="What would you like to get done?" aria-label="New task">
        <button id="new-task-btn" type="button" py-click="add_task()">Add task</button>
      </div>

      <div class="tasks-heading">
        <h2>Tasks</h2>
        <span>Check them off as you go</span>
      </div>

      <div id="list-tasks-container" aria-live="polite"></div>

      <template id="task-template">
        <section class="task py-li-element">
          <label class="task-label">
            <input type="checkbox" aria-label="Mark task complete">
            <p></p>
          </label>
        </section>
      </template>
    </main>
    </section>
</body>
</html>
